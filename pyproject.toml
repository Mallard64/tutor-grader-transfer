[project]
name = "tutor-grader-transfer"
version = "0.1.0"
description = "Does a tutor-response grader trained on math transfer to programming?"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7",
    "protobuf>=4.25",
    "accelerate>=0.33",
]
llm = [
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
]
label = [
    "streamlit>=1.37",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: needs the training stack and a HuggingFace download"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

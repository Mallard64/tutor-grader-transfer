# Experiment (c): the math-only grader. Trained once per seed and reused by (d).
name: math_base
model_name: microsoft/deberta-v3-base
train_domain: math
eval_domain: programming
k_programming: 0
seed: 0

max_length: 512
learning_rate: 2.0e-5
batch_size: 16
eval_batch_size: 32
num_epochs: 4.0

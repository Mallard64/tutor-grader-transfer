# Default run config. scripts/run_experiments.py loads this unless --config is given;
# each run overrides name/seed/k_programming/init_from and writes its own resolved
# copy to models/runs/<name>/config.yaml, so every checkpoint records how it was made.
name: base
model_name: microsoft/deberta-v3-base
train_domain: math
eval_domain: math
k_programming: 0
seed: 0

max_length: 512
learning_rate: 2.0e-5
# Effective batch is batch_size * gradient_accumulation_steps = 16.
# The split is not a laptop workaround -- batch 16 at 512 tokens does not fit
# anywhere we run. It swaps on a 16GB unified-memory Mac (~30x slower, no error)
# and it OOMs outright on a 15GB T4. Keep the accumulation.
batch_size: 8
eval_batch_size: 16
num_epochs: 4.0
warmup_ratio: 0.1
weight_decay: 0.01
gradient_accumulation_steps: 2

init_from: ""
output_dir: models/runs
